# gh-pages is the source branch; GitHub Pages used to serve it raw, which
# published the Vite dev template (blank page). This workflow builds the real
# bundle on every push and deploys dist/ instead. Note: `npm run deploy`
# (gh-pages -d dist) must never be run - it force-pushes built files onto the
# source branch and deletes its history.
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Try to switch the repo to workflow-based Pages automatically;
          # if the token can't, one manual click in Settings > Pages does it.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
