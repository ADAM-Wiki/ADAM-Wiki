<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-default>Adam-Wiki</title>
    <link rel="icon" type="image/png" href="/ADAM-Wiki/Icon-32x32.png" />

    <!--
      Overwritten by the theme script below before first paint, and again by
      useTheme on every toggle. Without it mobile browser chrome stays its own
      colour and the page appears to float in a differently-coloured frame.
    -->
    <meta name="theme-color" content="#11100d" />

    <!--
      The two base Latin subsets: Inter sets all body and interface text,
      Cormorant every heading, so these two are what the reader watches swap in.
      The matching latin-ext files carry the Serbian diacritics and are left to
      normal discovery - preloading all four would put 200kB ahead of the
      application bundle, which costs more than the swap it saves.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/ADAM-Wiki/fonts/inter-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/ADAM-Wiki/fonts/cormorant-latin.woff2"
      crossorigin
    />

    <!--
      Fallback metadata for any route that is not prerendered. Every tag below
      carries data-default: the prerenderer drops it whenever the page's own
      Helmet tags supply the same key, so crawlers never see a duplicate.

      These matter because social crawlers do not execute JavaScript - without
      them a shared link previews with no title, description or image.
    -->
    <meta
      data-default
      name="description"
      content="Adam-Wiki — članci i odgovori o islamu, hadisu, hrišćanstvu, ateizmu i istoriji."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="Adam-Wiki" />
    <meta property="og:locale" content="sr_RS" />
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:title" content="Adam-Wiki" />
    <meta
      data-default
      property="og:description"
      content="Adam-Wiki — članci i odgovori o islamu, hadisu, hrišćanstvu, ateizmu i istoriji."
    />
    <meta
      data-default
      property="og:url"
      content="https://adam-wiki.github.io/ADAM-Wiki/"
    />
    <meta
      data-default
      property="og:image"
      content="https://adam-wiki.github.io/ADAM-Wiki/images/og-default.jpg"
    />

    <meta data-default name="twitter:card" content="summary_large_image" />
    <meta data-default name="twitter:title" content="Adam-Wiki" />
    <meta
      data-default
      name="twitter:description"
      content="Adam-Wiki — članci i odgovori o islamu, hadisu, hrišćanstvu, ateizmu i istoriji."
    />
    <meta
      data-default
      name="twitter:image"
      content="https://adam-wiki.github.io/ADAM-Wiki/images/og-default.jpg"
    />

    <!--
      Applies the saved theme before first paint. Pages are prerendered with the
      dark theme baked in, so without this a light-theme visitor sees a dark
      flash on every navigation.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("adam-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute(
              "content",
              theme === "light" ? "#f5f1e8" : "#11100d",
            );
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (function (l) {
        if (l.search) {
          var q = {};
          l.search
            .slice(1)
            .split("&")
            .forEach(function (v) {
              var a = v.split("=");
              q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
            });

          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.replace(/\/$/, "") +
                (q.p || "") +
                (q.q ? "?" + q.q : "") +
                l.hash,
            );
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
