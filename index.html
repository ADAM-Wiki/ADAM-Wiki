<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADAM</title>
    <link rel="icon" type="image/png" href="/ADAM-Wiki/Icon-32x32.png" />

    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (function (l) {
        if (l.search.startsWith("?p=/")) {
          var path = l.search.slice(4); // removes "?p=/" (4 chars, not 3)
          window.history.replaceState(null, null, l.pathname + path + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
