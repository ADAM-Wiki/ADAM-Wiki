<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADAM</title>
    <link rel="icon" type="image/png" href="/ADAM-Wiki/Icon-32x32.png" />

    <!-- GitHub Pages SPA redirect restore -->
    <script>
      (function (l) {
        if (l.search) {
          var q = {};
          l.search
            .slice(1)
            .split("&")
            .forEach(function (v) {
              var a = v.split("=");
              q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
            });

          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.replace(/\/$/, "") +
                (q.p || "") +
                (q.q ? "?" + q.q : "") +
                l.hash,
            );
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
